spring:
  application:
    name: InteliPath

  profiles:
    active: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # HikariCP: Connection Pool giúp quản lý kết nối DB
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      # Close excess idle connections after 5 minutes.
      idle-timeout: 300000
      # Refresh connections before long-lived pooler sessions become stale.
      max-lifetime: 1200000
      # Maximum time to wait for a connection from the pool.
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
    connect-retries: 10
    connect-retries-interval: 5s

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID_GOOGLE}
            client-secret: ${CLIENT_SECRET_GOOGLE}
            scope:
              - email
              - profile
          github:
            client-id: ${CLIENT_ID_GITHUB}
            client-secret: ${CLIENT_SECRET_GITHUB}
            scope:
              - user:email
              - read:user

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL}
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
    mcp:
      client:
        enabled: ${MCP_DOCUMENT_SERVICE_ENABLED:false}
        initialized: ${MCP_DOCUMENT_SERVICE_ENABLED:false}
        request-timeout: ${MCP_DOCUMENT_SERVICE_TIMEOUT:60s}
        streamable-http:
          connections:
            document-tools:
              # Spring's Streamable-HTTP client appends its MCP endpoint path (/mcp).
              url: ${MCP_DOCUMENT_SERVICE_URL:http://localhost:8000}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

scraper:
  limit: ${SCRAPER_LIMIT}
  topcv-api: ${SCRAPER_API}
