# ============================================================
# Usage:
# - Start: docker compose up -d
# - Stop:  docker compose down
# - Logs:  docker compose logs -f backend
# ============================================================


services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelipath-backend
    ports:
      - "8080:8080"

    env_file:
      - .env
    restart: unless-stopped