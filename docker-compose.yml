# ============================================================
# BASE compose - config shared by every environment.
# Edit THIS file for changes common to dev and prod.
#
# Dev  : docker compose up -d
#        (auto-merges docker-compose.override.yml -> DB/AI exposed on localhost)
# Prod : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#        (DB/AI stay internal, a real POSTGRES_PASSWORD is required)
#
# By default only the backend API (8080) is published. Postgres and the AI
# service have NO host port here - they are reachable only inside the compose
# network. Each environment file decides how (or whether) to expose them.
# ============================================================

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: intelipath-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intelipath}
      POSTGRES_USER: ${POSTGRES_USER:-intelipath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intelipath_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intelipath} -d ${POSTGRES_DB:-intelipath}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ai-service:
    build:
      context: ../intelipath-service
      dockerfile: Dockerfile
    container_name: intelipath-service
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelipath-backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-intelipath}
      DB_USERNAME: ${POSTGRES_USER:-intelipath}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-intelipath_dev_password}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_URL: http://ai-service:8000/api/extract
      SCRAPER_API: http://ai-service:8000/api/v1/scraper/scrape/topcv/
      MCP_DOCUMENT_SERVICE_ENABLED: "true"
      MCP_DOCUMENT_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
