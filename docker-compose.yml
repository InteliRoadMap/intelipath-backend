# ============================================================
# Usage:
# - Start: docker compose up -d
# - Stop:  docker compose down
# - Logs:  docker compose logs -f backend
# ============================================================


services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: intelipath-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intelipath}
      POSTGRES_USER: ${POSTGRES_USER:-intelipath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intelipath_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intelipath} -d ${POSTGRES_DB:-intelipath}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ai-service:
    build:
      context: ../intelipath-service
      dockerfile: Dockerfile
    container_name: intelipath-service
    ports:
      - "8000:8000"
    env_file:
      # Service secrets (SERVICE_API_KEY, LLM_API_KEY, ...). DATABASE_URL below
      # overrides the one in .env (localhost) with the compose network host.
      - ../intelipath-service/.env
    environment:
      # Service owns its OWN database ("scraper") on the shared Postgres server,
      # reached over the compose network (host = postgres), not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-intelipath}:${POSTGRES_PASSWORD:-intelipath_dev_password}@postgres:5432/scraper
      # The scraper shells out to the system `curl`, which natively honours these
      # proxy env vars (no code change needed). Point SCRAPER_PROXY at a
      # residential / Cloudflare-solving proxy to get past TopCV's anti-bot.
      # Empty = direct connection (default). postgres stays direct via NO_PROXY.
      HTTPS_PROXY: ${SCRAPER_PROXY:-}
      ALL_PROXY: ${SCRAPER_PROXY:-}
      NO_PROXY: postgres,localhost,127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelipath-backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro

    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-intelipath}
      DB_USERNAME: ${POSTGRES_USER:-intelipath}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-intelipath_dev_password}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      MCP_DOCUMENT_SERVICE_ENABLED: "true"
      MCP_DOCUMENT_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
