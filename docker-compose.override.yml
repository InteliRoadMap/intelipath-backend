# ============================================================
# DEV overrides - applied AUTOMATICALLY by `docker compose up`.
# Exposes Postgres and the AI service on localhost ONLY (127.0.0.1), so you can
# connect a DB GUI (DBeaver/pgAdmin) or hit the AI service directly from your
# machine, without opening them to the network / internet.
# ============================================================

services:

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  ai-service:
    ports:
      - "127.0.0.1:8000:8000"
